name: Institutional Data Pipeline

on:

  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create Directories
        run: |
          mkdir -p exports
          mkdir -p data/cache/parquet

      - name: Run Institutional Pipeline
        run: |
          python ranking/final_ranking_engine.py

      - name: Validate Outputs
        run: |
          ls -lh exports/
          ls -lh data/cache/parquet/

      - name: Commit Updated Files
        run: |

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add exports/
          git add data/cache/parquet/

          git commit -m "Automated institutional refresh" || echo "No changes to commit"

          git push

      - name: Workflow Complete
        run: |
          echo "Institutional pipeline completed successfully."
