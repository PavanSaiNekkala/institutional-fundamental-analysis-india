name: Institutional Data Pipeline

on:

  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      # =====================================================
      # CREATE DIRECTORIES
      # =====================================================

      - name: Create Directories
        run: |

          mkdir -p data/cache/parquet
          mkdir -p exports

      # =====================================================
      # PIPELINE
      # =====================================================

      - name: Run NSE Collector
        run: |

          python -m collectors.nse_collector

      - name: Run Screener Collector
        run: |

          python -m collectors.screener_collector

      - name: Run Cleaner
        run: |

          python -m preprocessing.cleaner

      - name: Run Growth Score
        run: |

          python -m scoring.growth_score

      - name: Run Quality Score
        run: |

          python -m scoring.quality_score

      - name: Run Valuation Score
        run: |

          python -m scoring.valuation_score

      - name: Run Ownership Score
        run: |

          python -m scoring.ownership_score

      - name: Run Final Ranking Engine
        run: |

          python -m ranking.final_ranking_engine

      # =====================================================
      # COMMIT OUTPUTS
      # =====================================================

      - name: Commit Generated Files

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "actions@github.com"

          git add .

          git diff --cached --quiet || git commit -m "Automated institutional pipeline update"

          git push
