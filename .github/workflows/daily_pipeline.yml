name: Institutional Data Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * 1-5"

jobs:

  institutional-analysis:

    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:

      # =====================================
      # CHECKOUT
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================
      # PYTHON SETUP
      # =====================================

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================
      # INSTALL DEPENDENCIES
      # =====================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================
      # VERIFY EXCEL UNIVERSE
      # =====================================

      - name: Verify Universe File
        run: |
          ls -lh data/raw/
          test -f data/raw/yfinance_stock_urls.xlsx

      # =====================================
      # FINANCIAL COLLECTOR
      # =====================================

      - name: Run Financial Collector
        run: |
          python collectors/screener_collector.py

      # =====================================
      # DATA CLEANER
      # =====================================

      - name: Run Data Cleaner
        run: |
          python preprocessing/cleaner.py

      # =====================================
      # GROWTH SCORING
      # =====================================

      - name: Run Growth Scoring
        run: |
          python scoring/growth_score.py

      # =====================================
      # QUALITY SCORING
      # =====================================

      - name: Run Quality Scoring
        run: |
          python scoring/quality_score.py

      # =====================================
      # OWNERSHIP SCORING
      # =====================================

      - name: Run Ownership Scoring
        run: |
          python scoring/ownership_score.py

      # =====================================
      # FINAL RANKING
      # =====================================

      - name: Run Final Ranking Engine
        run: |
          python ranking/final_ranking_engine.py

      # =====================================
      # EXPORT RESULTS
      # =====================================

      - name: Export Excel Results
        run: |
          python exports/excel_exporter.py

      # =====================================
      # UPLOAD OUTPUTS
      # =====================================

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: institutional-analysis-results
          path: |
            data/financials/
            data/cleaned/
            exports/
